<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lab-butler</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.header h1 { font-size: 16px; font-weight: 600; color: var(--cyan); letter-spacing: 0.5px; }
.nav { display: flex; gap: 18px; }
.nav a { color: var(--text-dim); font-size: 12px; }
.nav a:hover { color: var(--text); text-decoration: none; }
.nav a.active { color: var(--cyan); }
.header .status { font-size: 11px; color: var(--text-dim); }
.header .status .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gray);
    margin-right: 6px;
    vertical-align: middle;
}
.header .status .dot.up { background: var(--green); }
.header .status .dot.down { background: var(--red); }
.container { padding: 16px 24px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
}
.card h2 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
.kv .k { color: var(--text-dim); }
.kv .v { color: var(--text); }
.v.ok { color: var(--green); }
.v.bad { color: var(--red); }
.v.unknown { color: var(--gray); }
.note { color: var(--text-dim); font-size: 11px; margin-top: 10px; }
.card.wide { grid-column: 1 / -1; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.card-head h2 { margin-bottom: 0; }
.card-head a { font-size: 11px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filters select, .filters input[type=text] {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 8px; border-radius: 4px; font-family: inherit; font-size: 12px;
}
.count { color: var(--text-dim); font-size: 11px; margin-left: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 10px; }
.sev0, .sev1, .sev2, .sev3 { color: var(--red); }
.sev4 { color: var(--yellow); }
.sev5, .sev6 { color: var(--text); }
.sev7 { color: var(--text-dim); }
.sev-null { color: var(--gray); }
.mono { white-space: pre-wrap; word-break: break-word; }
.empty { color: var(--text-dim); padding: 12px 0; }
</style>
</head>
<body>
<div class="header">
    <h1>lab-butler</h1>
    <nav class="nav">
        <a href="/" class="active">Dashboard</a>
        <a href="/devices">Devices</a>
        <a href="/conflicts">Conflicts</a>
        <a href="/ipam">IPAM</a>
        <a href="/templates">Templates</a>
        <a href="/topology">Topology</a>
        <a href="/syslog">Syslog</a>
        <select id="theme-select" class="theme-select" aria-label="Colour theme" onchange="setTheme(this.value)"></select>
    </nav>
    <div class="status"><span class="dot" id="health-dot"></span><span id="health-text">checking...</span></div>
</div>
<div class="container">
    <div class="card">
        <h2>System</h2>
        <div id="time-body"><div class="kv"><span class="k">loading</span></div></div>
        <div id="system-body"><div class="kv"><span class="k">loading</span></div></div>
    </div>
    <div class="card">
        <h2>Services</h2>
        <div id="services-body"><div class="kv"><span class="k">loading</span></div></div>
    </div>
    <div class="card wide">
        <div class="card-head"><h2>Syslog — last 15</h2><a href="/syslog">view all</a></div>
        <div class="filters">
            <select id="f-minutes">
                <option value="15">last 15m</option>
                <option value="60" selected>last 60m</option>
                <option value="360">last 6h</option>
                <option value="1440">last 24h</option>
            </select>
            <select id="f-host"><option value="">all hosts</option></select>
            <select id="f-severity">
                <option value="">all severities</option>
                <option value="3">error or worse</option>
                <option value="4">warning or worse</option>
                <option value="6">info or worse</option>
            </select>
            <input type="text" id="f-q" placeholder="search message...">
            <span class="count" id="row-count"></span>
        </div>
        <table>
            <thead><tr><th>Time</th><th>Host</th><th>Sev</th><th>Mnemonic</th><th>Message</th></tr></thead>
            <tbody id="syslog-rows"></tbody>
        </table>
        <div class="empty" id="syslog-empty" style="display:none">no messages in this window</div>
    </div>
</div>
<script>
function kv(k, v, cls) {
    return '<div class="kv"><span class="k">' + k + '</span><span class="v' +
        (cls ? ' ' + cls : '') + '">' + v + '</span></div>';
}

function fmtBytes(n) {
    if (n === null || n === undefined) { return 'unknown'; }
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) { n = n / 1024; i++; }
    return n.toFixed(1) + ' ' + units[i];
}

function renderTime(data) {
    var html = kv('server utc', data.utc);
    if (data.chrony) {
        html += kv('synced', data.chrony.synced ? 'yes' : 'no', data.chrony.synced ? 'ok' : 'bad');
        html += kv('stratum', data.chrony.stratum === null ? 'unknown' : data.chrony.stratum);
        if (data.chrony.local_only) {
            html += '<div class="note">clock is free-running (no upstream source)</div>';
        }
    } else {
        html += kv('chrony', data.reason || 'unavailable', 'unknown');
    }
    document.getElementById('time-body').innerHTML = html;
}

function renderHealth(data) {
    var dot = document.getElementById('health-dot');
    var text = document.getElementById('health-text');
    dot.className = 'dot up';
    text.textContent = 'up since ' + (data.uptime_s ? Math.floor(data.uptime_s / 60) + 'm' : 'unknown');

    var services = '';
    for (var name in data.services) {
        if (!data.services.hasOwnProperty(name)) { continue; }
        var s = data.services[name];
        var cls = s.status === 'up' ? 'ok' : (s.status === 'down' ? 'bad' : 'unknown');
        services += kv(name, s.status || 'unknown', cls);
    }
    services += kv('syslog listener', data.syslog_listening ? 'up' : 'down', data.syslog_listening ? 'ok' : 'bad');
    services += kv('poller', data.poller_running ? 'up' : 'down', data.poller_running ? 'ok' : 'bad');
    document.getElementById('services-body').innerHTML = services;

    var system = '';
    if (data.load_avg) {
        system += kv('load', data.load_avg['1m'].toFixed(2) + ' / ' + data.load_avg['5m'].toFixed(2) + ' / ' + data.load_avg['15m'].toFixed(2));
    } else {
        system += kv('load', 'unknown', 'unknown');
    }
    if (data.memory) {
        system += kv('memory used', data.memory.used_pct + '%');
    } else {
        system += kv('memory', 'unknown', 'unknown');
    }
    if (data.disk) {
        system += kv('disk used', data.disk.used_pct + '% (' + fmtBytes(data.disk.free_bytes) + ' free)');
    } else {
        system += kv('disk', 'unknown', 'unknown');
    }
    document.getElementById('system-body').innerHTML = system;
}

function poll() {
    fetch('/api/time').then(function (r) { return r.json(); }).then(renderTime).catch(function () {
        document.getElementById('time-body').innerHTML = kv('error', 'request failed', 'bad');
    });
    fetch('/api/health').then(function (r) { return r.json(); }).then(renderHealth).catch(function () {
        document.getElementById('health-dot').className = 'dot down';
        document.getElementById('health-text').textContent = 'unreachable';
    });
}

// Syslog box — same filters and rendering as syslog.html, capped at 15 rows.
var SYSLOG_LIMIT = 15;
var SEV_NAMES = {0: 'emerg', 1: 'alert', 2: 'crit', 3: 'err', 4: 'warn', 5: 'notice', 6: 'info', 7: 'debug'};

function esc(s) {
    var d = document.createElement('div');
    d.textContent = s === null || s === undefined ? '' : String(s);
    return d.innerHTML;
}

function loadSources() {
    fetch('/api/syslog/sources').then(function (r) { return r.json(); }).then(function (list) {
        var sel = document.getElementById('f-host');
        var current = sel.value;
        var html = '<option value="">all hosts</option>';
        for (var i = 0; i < list.length; i++) {
            html += '<option value="' + esc(list[i].name) + '">' + esc(list[i].name) + ' (' + list[i].count + ')</option>';
        }
        sel.innerHTML = html;
        sel.value = current;
    });
}

function loadSyslog() {
    var params = ['limit=' + SYSLOG_LIMIT];
    params.push('minutes=' + document.getElementById('f-minutes').value);
    var host = document.getElementById('f-host').value;
    if (host) { params.push('host=' + encodeURIComponent(host)); }
    var sev = document.getElementById('f-severity').value;
    if (sev !== '') { params.push('severity=' + sev); }
    var q = document.getElementById('f-q').value.trim();
    if (q) { params.push('q=' + encodeURIComponent(q)); }

    fetch('/api/syslog?' + params.join('&')).then(function (r) { return r.json(); }).then(function (list) {
        var rows = '';
        for (var i = 0; i < list.length; i++) {
            var m = list[i];
            var sevCls = m.severity === null || m.severity === undefined ? 'sev-null' : 'sev' + m.severity;
            var sevLabel = m.severity === null || m.severity === undefined ? '' : (m.severity + ' ' + (SEV_NAMES[m.severity] || ''));
            var hostCell = m.host || m.source_ip;
            if (m.device_id) {
                hostCell = '<a href="/devices/' + m.device_id + '">' + esc(hostCell) + '</a>';
            } else {
                hostCell = esc(hostCell);
            }
            rows += '<tr>' +
                '<td>' + new Date(m.received_at).toLocaleString() + '</td>' +
                '<td>' + hostCell + '</td>' +
                '<td class="' + sevCls + '">' + esc(sevLabel) + '</td>' +
                '<td>' + esc(m.mnemonic || '') + '</td>' +
                '<td class="mono">' + esc(m.message) + '</td>' +
                '</tr>';
        }
        document.getElementById('syslog-rows').innerHTML = rows;
        document.getElementById('syslog-empty').style.display = list.length ? 'none' : 'block';
        document.getElementById('row-count').textContent = list.length + ' shown';
    }).catch(function () {
        document.getElementById('row-count').textContent = 'request failed';
    });
}

document.getElementById('f-minutes').addEventListener('change', loadSyslog);
document.getElementById('f-host').addEventListener('change', loadSyslog);
document.getElementById('f-severity').addEventListener('change', loadSyslog);
document.getElementById('f-q').addEventListener('input', function () {
    clearTimeout(window._q_timer);
    window._q_timer = setTimeout(loadSyslog, 300);
});

function pollAll() {
    poll();
    loadSources();
    loadSyslog();
}

pollAll();
setInterval(pollAll, 15000);
</script>
</body>
</html>
