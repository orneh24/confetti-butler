<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lab-butler — Syslog</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', monospace;
    background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5;
}
a { color: var(--blue); text-decoration: none; }
.header {
    background: var(--bg-card); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 16px; font-weight: 600; color: var(--cyan); }
.nav { display: flex; gap: 18px; }
.nav a { color: var(--text-dim); font-size: 12px; }
.nav a.active { color: var(--cyan); }
.filters {
    padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
}
select, input[type=text] {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 8px; border-radius: 4px; font-family: inherit; font-size: 12px;
}
.container { padding: 12px 24px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 10px; position: sticky; top: 0; background: var(--bg-card); }
.sev0, .sev1, .sev2, .sev3 { color: var(--red); }
.sev4 { color: var(--yellow); }
.sev5, .sev6 { color: var(--text); }
.sev7 { color: var(--text-dim); }
.sev-null { color: var(--gray); }
.mono { white-space: pre-wrap; word-break: break-word; }
.empty { color: var(--text-dim); padding: 12px 0; }
.count { color: var(--text-dim); font-size: 11px; margin-left: auto; }
</style>
</head>
<body>
<div class="header">
    <h1>lab-butler</h1>
    <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/devices">Devices</a>
        <a href="/conflicts">Conflicts</a>
        <a href="/ipam">IPAM</a>
        <a href="/templates">Templates</a>
        <a href="/topology">Topology</a>
        <a href="/syslog" class="active">Syslog</a>
        <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">Light mode</button>
    </nav>
</div>
<div class="filters">
    <select id="f-minutes">
        <option value="15">last 15m</option>
        <option value="60" selected>last 60m</option>
        <option value="360">last 6h</option>
        <option value="1440">last 24h</option>
    </select>
    <select id="f-host"><option value="">all hosts</option></select>
    <select id="f-severity">
        <option value="">all severities</option>
        <option value="3">error or worse</option>
        <option value="4">warning or worse</option>
        <option value="6">info or worse</option>
    </select>
    <input type="text" id="f-q" placeholder="search message...">
    <span class="count" id="row-count"></span>
</div>
<div class="container">
    <table>
        <thead><tr><th>Time</th><th>Host</th><th>Sev</th><th>Mnemonic</th><th>Message</th></tr></thead>
        <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">no messages in this window</div>
</div>
<script>
var SEV_NAMES = {0: 'emerg', 1: 'alert', 2: 'crit', 3: 'err', 4: 'warn', 5: 'notice', 6: 'info', 7: 'debug'};

function esc(s) {
    var d = document.createElement('div');
    d.textContent = s === null || s === undefined ? '' : String(s);
    return d.innerHTML;
}

function fmtTime(iso) {
    var d = new Date(iso);
    return d.toLocaleString();
}

function loadSources() {
    fetch('/api/syslog/sources').then(function (r) { return r.json(); }).then(function (list) {
        var sel = document.getElementById('f-host');
        var current = sel.value;
        var html = '<option value="">all hosts</option>';
        for (var i = 0; i < list.length; i++) {
            html += '<option value="' + esc(list[i].name) + '">' + esc(list[i].name) + ' (' + list[i].count + ')</option>';
        }
        sel.innerHTML = html;
        sel.value = current;
    });
}

function load() {
    var params = [];
    params.push('minutes=' + document.getElementById('f-minutes').value);
    var host = document.getElementById('f-host').value;
    if (host) { params.push('host=' + encodeURIComponent(host)); }
    var sev = document.getElementById('f-severity').value;
    if (sev !== '') { params.push('severity=' + sev); }
    var q = document.getElementById('f-q').value.trim();
    if (q) { params.push('q=' + encodeURIComponent(q)); }

    fetch('/api/syslog?' + params.join('&')).then(function (r) { return r.json(); }).then(function (list) {
        var rows = '';
        for (var i = 0; i < list.length; i++) {
            var m = list[i];
            var sevCls = m.severity === null || m.severity === undefined ? 'sev-null' : 'sev' + m.severity;
            var sevLabel = m.severity === null || m.severity === undefined ? '' : (m.severity + ' ' + (SEV_NAMES[m.severity] || ''));
            var hostCell = m.host || m.source_ip;
            if (m.device_id) {
                hostCell = '<a href="/devices/' + m.device_id + '">' + esc(hostCell) + '</a>';
            } else {
                hostCell = esc(hostCell);
            }
            rows += '<tr>' +
                '<td>' + fmtTime(m.received_at) + '</td>' +
                '<td>' + hostCell + '</td>' +
                '<td class="' + sevCls + '">' + esc(sevLabel) + '</td>' +
                '<td>' + esc(m.mnemonic || '') + '</td>' +
                '<td class="mono">' + esc(m.message) + '</td>' +
                '</tr>';
        }
        document.getElementById('rows').innerHTML = rows;
        document.getElementById('empty').style.display = list.length ? 'none' : 'block';
        document.getElementById('row-count').textContent = list.length + ' messages';
    });
}

document.getElementById('f-minutes').addEventListener('change', load);
document.getElementById('f-host').addEventListener('change', load);
document.getElementById('f-severity').addEventListener('change', load);
document.getElementById('f-q').addEventListener('input', function () {
    clearTimeout(window._q_timer);
    window._q_timer = setTimeout(load, 300);
});

loadSources();
load();
setInterval(function () { loadSources(); load(); }, 15000);
</script>
</body>
</html>
