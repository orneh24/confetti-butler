<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lab-butler — IPAM</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', monospace;
    background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5;
}
a { color: var(--blue); text-decoration: none; }
.header {
    background: var(--bg-card); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 16px; font-weight: 600; color: var(--cyan); }
.nav { display: flex; gap: 18px; }
.nav a { color: var(--text-dim); font-size: 12px; }
.nav a.active { color: var(--cyan); }
.container { padding: 16px 24px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card.full { grid-column: 1 / -1; }
.card h2 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 10px; }
.pill { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.bad { background: var(--red-bg); color: var(--red); }
.empty { color: var(--text-dim); padding: 8px 0; font-size: 12px; }
button {
    background: var(--bg-hover); border: 1px solid var(--border); color: var(--text);
    padding: 5px 12px; border-radius: 4px; font-family: inherit; font-size: 12px; cursor: pointer;
}
button:hover { border-color: var(--blue); }
</style>
</head>
<body>
<div class="header">
    <h1>lab-butler</h1>
    <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/devices">Devices</a>
        <a href="/conflicts">Conflicts</a>
        <a href="/ipam" class="active">IPAM</a>
        <a href="/templates">Templates</a>
        <a href="/topology">Topology</a>
        <a href="/syslog">Syslog</a>
        <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">Light mode</button>
    </nav>
</div>
<div class="container">
    <div class="card full">
        <h2>Findings <button onclick="analyze()">Re-analyze</button></h2>
        <table><thead><tr><th>Kind</th><th>A</th><th>B</th><th>Detail</th><th>Checked</th></tr></thead>
            <tbody id="finding-rows"></tbody></table>
        <div class="empty" id="finding-empty" style="display:none">no findings — run an analysis, or nothing is wrong</div>
    </div>
    <div class="card">
        <h2>Prefixes in use</h2>
        <table><thead><tr><th>Network</th><th>Interfaces</th><th>Devices</th></tr></thead>
            <tbody id="prefix-rows"></tbody></table>
    </div>
    <div class="card">
        <h2>Addresses</h2>
        <table><thead><tr><th>IP</th><th>Device</th><th>Interface</th><th>Status</th></tr></thead>
            <tbody id="address-rows"></tbody></table>
    </div>
</div>
<script>
function esc(s) {
    var d = document.createElement('div');
    d.textContent = s === null || s === undefined ? '' : String(s);
    return d.innerHTML;
}

function loadFindings() {
    fetch('/api/ipam/findings').then(function (r) { return r.json(); }).then(function (list) {
        var rows = '';
        for (var i = 0; i < list.length; i++) {
            var f = list[i];
            rows += '<tr><td>' + esc(f.kind) + '</td><td>' + esc(f.a) + '</td><td>' + esc(f.b || '') +
                '</td><td>' + esc(f.detail) + '</td><td>' + esc(f.checked_at) + '</td></tr>';
        }
        document.getElementById('finding-rows').innerHTML = rows;
        document.getElementById('finding-empty').style.display = list.length ? 'none' : 'block';
    });
}

function loadPrefixes() {
    fetch('/api/ipam/prefixes').then(function (r) { return r.json(); }).then(function (list) {
        var rows = '';
        for (var i = 0; i < list.length; i++) {
            var p = list[i];
            rows += '<tr><td>' + esc(p.network) + '</td><td>' + p.interfaces + '</td><td>' + p.devices + '</td></tr>';
        }
        document.getElementById('prefix-rows').innerHTML = rows || '<tr><td colspan="3" class="empty">none yet</td></tr>';
    });
}

function loadAddresses() {
    fetch('/api/ipam/addresses').then(function (r) { return r.json(); }).then(function (list) {
        var rows = '';
        for (var i = 0; i < list.length; i++) {
            var a = list[i];
            var cls = a.oper_status === 'up' ? 'ok' : 'bad';
            rows += '<tr><td>' + esc(a.ip) + '/' + a.prefix_len + '</td>' +
                '<td><a href="/devices/' + a.device_id + '">' + esc(a.hostname) + '</a></td>' +
                '<td>' + esc(a.interface) + '</td>' +
                '<td><span class="pill ' + cls + '">' + esc(a.oper_status) + '</span></td></tr>';
        }
        document.getElementById('address-rows').innerHTML = rows || '<tr><td colspan="4" class="empty">none yet</td></tr>';
    });
}

function loadAll() {
    loadFindings();
    loadPrefixes();
    loadAddresses();
}

function analyze() {
    fetch('/api/ipam/analyze', { method: 'POST' }).then(function (r) { return r.json(); }).then(loadAll);
}

loadAll();
</script>
</body>
</html>
